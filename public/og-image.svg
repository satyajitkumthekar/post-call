<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="540" y="180" width="120" height="1" fill="#C9A84C" opacity="0.5"/>

  <!-- Gold circle icon -->
  <circle cx="600" cy="236" r="18" fill="none" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- Main headline — large and bold -->
  <text
    x="600"
    y="320"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="64"
    letter-spacing="6"
    fill="#F0EDE8"
    text-anchor="middle"
    dominant-baseline="middle"
  >YOUR CALL IS</text>

  <text
    x="600"
    y="400"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="64"
    letter-spacing="6"
    fill="#C9A84C"
    text-anchor="middle"
    dominant-baseline="middle"
  >CONFIRMED</text>

  <!-- Thin gold rule -->
  <rect x="480" y="445" width="240" height="1" fill="#C9A84C" opacity="0.3"/>

  <!-- Brand name -->
  <text
    x="600"
    y="475"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="13"
    letter-spacing="6"
    fill="#8A8580"
    text-anchor="middle"
  >SUPERHUMAN LAB</text>
</svg>
