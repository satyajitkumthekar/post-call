<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="circleShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#C9A84C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold circle icon — centered at x=600, offset left of text -->
  <circle cx="370" cy="315" r="20" fill="none" stroke="#C9A84C" stroke-width="1.5" filter="url(#circleShadow)"/>

  <!-- SUPERHUMAN + LAB on one line, centered -->
  <text
    x="600"
    y="333"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="300"
    font-size="48"
    letter-spacing="14"
    fill="#F0EDE8"
    text-anchor="middle"
    dominant-baseline="middle"
  >SUPERHUMAN <tspan fill="#C9A84C">LAB</tspan></text>

  <!-- Thin gold rule -->
  <line x1="480" y1="380" x2="720" y2="380" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- Tagline -->
  <text
    x="600"
    y="416"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="300"
    font-size="14"
    letter-spacing="5"
    fill="#8A8580"
    text-anchor="middle"
  >YOUR CALL IS CONFIRMED</text>
</svg>
