<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0B"/>

  <!-- Subtle gold radial glow behind logo -->
  <radialGradient id="glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold circle icon -->
  <circle cx="480" cy="315" r="22" fill="none" stroke="#C9A84C" stroke-width="1.5" filter="url(#circleShadow)"/>
  <filter id="circleShadow">
    <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#C9A84C" flood-opacity="0.35"/>
  </filter>

  <!-- SUPERHUMAN text -->
  <text
    x="518"
    y="330"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="300"
    font-size="52"
    letter-spacing="14"
    fill="#F0EDE8"
  >SUPERHUMAN</text>

  <!-- LAB text -->
  <text
    x="518"
    y="382"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="300"
    font-size="52"
    letter-spacing="14"
    fill="#C9A84C"
  >LAB</text>

  <!-- Thin gold divider line -->
  <line x1="440" y1="420" x2="760" y2="420" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Tagline -->
  <text
    x="600"
    y="460"
    font-family="Arial, sans-serif"
    font-weight="300"
    font-size="16"
    letter-spacing="4"
    fill="#8A8580"
    text-anchor="middle"
  >YOUR CALL IS CONFIRMED</text>
</svg>
